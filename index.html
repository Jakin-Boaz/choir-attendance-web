<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="찬양대 출석부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>찬양대 출석부</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE: 밝고 다정한 학습 앱처럼 — 칭찬하고 북돋는 말투
   IDEA: 모임마다 한 칸씩 채워지는 출석 '길'과 연속 출석 불꽃
   PICTURE: 음표 캐릭터 '소리'와 지그재그로 이어지는 통통한 출석 노드
   COLOUR and TYPE: 흰 바탕, 연두 #58cc02 주색, 하늘 #1cb0f6 보조, 금색 #ffc800 포인트 / Jua 제목, Nunito 숫자, Gowun Dodum 본문
   LAYOUT: 휴대폰 한 열(최대 560px), 위 상태바, 아래 탭 4개 */
:root{color-scheme:light dark;--ld0:#fff;--ld1:#3c3c3c;--ld2:#777;--ld3:#e5e5e5;--ld4:#f7f7f7;--ld5:#ddf4ff;--ld6:#d7ffb8;--ld7:#3f7d00;--ld8:#cdcdcd;--ld9:#fff9e0;--bg:var(--ld0);--ink:var(--ld1);--mute:var(--ld2);--line:var(--ld3);--soft:var(--ld4);--sky:var(--ld5);--g:#58cc02;--gd:#58a700;--b:#1cb0f6;--bd:#1899d6;--gold:#ffc800;--goldd:#e0a800;--red:#ff4b4b;--fire:#ff9600}
@media(prefers-color-scheme:dark){:root{--ld0:#131f24;--ld1:#f1f7fb;--ld2:#8fa6b2;--ld3:#37464f;--ld4:#1c2a31;--ld5:#183a4b;--ld6:#203d14;--ld7:#9be15d;--ld8:#25333a;--ld9:#2a2914}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Nunito','Gowun Dodum',system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,h4,.btn,.seg button,.chip,.tag,.tabbar span,.stat b,.node small,.pill,.rank,.tg,.pr span,.num,.done,.bubble{font-family:'Nunito','Jua',system-ui,sans-serif;font-weight:800;font-synthesis:none}
.app{max-width:560px;margin:0 auto;padding:0 16px 116px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:16px;padding:10px 0;border-bottom:2px solid var(--line);margin-bottom:14px;min-height:62px}
header.top:empty{display:none}
.chip.part{margin-right:auto;border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);color:var(--c);border-radius:12px;padding:6px 12px;font-size:15px;cursor:pointer;min-height:44px}
.stat{display:flex;align-items:center;gap:4px;font-size:18px}.stat svg{width:26px;height:26px}.fire b{color:var(--fire)}.gem b{color:var(--b)}
.banner{background:var(--sky);border-radius:14px;padding:10px 14px;font-size:14px;margin:0 0 14px}
h1{font-size:30px;line-height:1.1;margin:6px 0 14px}h2{font-size:22px;line-height:1.2;margin:0 0 10px}
.sec{font-size:20px;margin:26px 0 12px}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--g);color:#fff;font-size:18px;padding:12px 18px;min-height:52px;box-shadow:0 4px 0 var(--gd);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 transparent}
.btn.big{font-size:22px;min-height:62px}.btn.blue{background:var(--b);box-shadow:0 4px 0 var(--bd)}
.btn.ghost{background:var(--bg);color:var(--b);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.link{background:none;border:0;color:var(--b);font:inherit;font-weight:800;cursor:pointer;padding:8px 10px;min-height:44px}.link.red{color:var(--red)}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px;background:var(--bg)}
.hero{display:grid;grid-template-columns:116px minmax(0,1fr);gap:14px;align-items:center;margin:4px 0 18px}
.mascot{width:116px;height:116px;display:block}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:18px;line-height:1.35;font-weight:400}
.bubble::before{content:'';position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--bg);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.seg{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-height:46px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--bg);color:var(--mute);font-size:16px;cursor:pointer;padding:6px 8px;white-space:nowrap}
.seg button.on{border-color:var(--b);background:var(--sky);color:var(--b)}
.done{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--ld6);color:var(--ld7);border-radius:16px;padding:16px;font-size:19px;font-weight:400}
.wait{text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:16px;padding:16px;font-size:16px}
h2 small.cnt{font-size:15px;color:var(--g);font-weight:400;margin-left:6px}
.done small.when{display:block;font-size:14px;opacity:.8}
.done svg{width:30px;height:30px;flex:none}.center{text-align:center}
.path{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0}
.node{transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center}
.dot{width:72px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--line);box-shadow:0 7px 0 var(--ld8)}
.dot svg{width:32px;height:32px}
.node.on .dot{background:var(--gold);box-shadow:0 7px 0 var(--goldd)}
.node.now .dot{background:var(--g);box-shadow:0 7px 0 var(--gd);animation:pulse 1.6s ease-in-out infinite}
.node small{font-size:13px;color:var(--mute);margin-top:10px;font-weight:400;white-space:nowrap}
.node.now small{color:var(--gd)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.badge{text-align:center;border:2px solid var(--line);border-radius:16px;padding:12px 6px;font-size:13px;color:var(--mute);line-height:1.3}
.badge i{display:grid;place-items:center;width:50px;height:50px;margin:0 auto 8px;border-radius:14px;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.badge i svg{width:28px;height:28px}.badge.lock i{background:var(--line);box-shadow:none}.badge.lock i svg{opacity:.5}
.badge b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
.notice h3{font-size:19px;margin:0 0 6px;line-height:1.3}.notice p{margin:0 0 6px}
.notice.pin{border-color:var(--gold);background:var(--ld9)}
.tag{display:inline-block;background:var(--gold);color:#4b3800;border-radius:8px;padding:2px 9px;font-size:13px;margin-bottom:6px;font-weight:400}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px;flex-wrap:wrap}
.form{display:grid;gap:10px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:11px 14px;width:100%;min-height:48px}
textarea{resize:vertical}
fieldset{border:2px dashed var(--line);border-radius:14px;padding:10px;display:grid;gap:8px;margin:0}legend{font-weight:800;padding:0 6px;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.chk{display:flex;gap:8px;align-items:center;font-weight:700;min-height:44px}.chk input{width:22px;height:22px;min-height:0}
.song{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:start}
.num{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:24px;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.song h3{margin:4px 0 2px;font-size:19px;line-height:1.3}.song p{margin:0;color:var(--mute)}
a.open{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--b);font-weight:800;text-decoration:none}a.open svg{width:18px;height:18px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{border:2px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;font-size:13px;color:var(--mute)}.tile b{display:block;font-size:clamp(22px,6vw,28px);font-weight:900;color:var(--ink)}
.bar{display:grid;grid-template-columns:88px minmax(0,1fr) 48px;gap:10px;align-items:center;margin:10px 0}
.bar span small{color:var(--mute)}.track{height:16px;border-radius:99px;background:var(--line);overflow:hidden}.track i{display:block;height:100%;border-radius:99px}
.bar b,.board b{text-align:right;font-weight:900;white-space:nowrap}
.board{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:30px 12px minmax(0,1fr) auto 52px;gap:10px;align-items:center;padding:12px 8px;border-bottom:2px solid var(--line)}
.board li.me{background:var(--sky);border-radius:12px;border-bottom-color:transparent}
.rank{text-align:center;font-size:18px;color:var(--mute)}.r1{color:#e0a800}.r2{color:#9aa5ad}.r3{color:#cd7f32}
.pdot{width:12px;height:12px;border-radius:50%;flex:none}
.nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{color:var(--mute);font-size:13px;white-space:nowrap}
.admin{border-color:var(--b)}.admin h4{margin:14px 0 8px;font-size:16px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tg{min-height:44px;padding:6px 14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);color:var(--ink);font-size:15px;cursor:pointer;font-weight:400}
.tg.on{background:var(--g);border-color:var(--gd);color:#fff}
.tg small{display:block;font-size:12px;line-height:1.2;opacity:.9}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 14px}.titlebar h1{margin:0}
.btn.share{width:auto;min-height:44px;font-size:15px;padding:8px 14px}
.awayh{margin:16px 0 4px;font-size:15px;color:var(--red)}
.away{list-style:none;margin:0;padding:0}.away li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 6px;border-bottom:2px solid var(--line);min-height:48px}
.away .nm{flex:0 1 auto}.away .why{flex:1;color:var(--mute);font-size:14px}.away li.edit{display:grid;grid-template-columns:12px minmax(0,1fr)}
.rform{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}.rform input{flex:1 1 180px}.rform .btn{width:auto;min-height:48px;padding:8px 16px;font-size:16px}
.meta .acts{display:flex;align-items:center;gap:2px}
.sharetext{text-align:left;font-size:15px;line-height:1.5}
.pendbox{border-color:var(--gold);background:var(--soft)}
.btn.mini{width:auto;min-height:40px;padding:6px 14px;font-size:15px;margin-left:auto}
.btn.red{background:var(--red);box-shadow:0 4px 0 #d33131}
.danger{border:2px solid var(--red);border-radius:14px;padding:12px;display:grid;gap:8px}.danger p{color:var(--ink)}
.mutedlink{color:var(--mute)}
.newpw{font:900 28px 'Nunito',monospace;color:var(--ink)!important;letter-spacing:1px;background:var(--soft);border-radius:12px;padding:12px;word-break:break-all}
.shot{width:100%;border-radius:12px;border:2px solid var(--line)}
.daylist li{grid-template-columns:78px 12px minmax(0,1fr) auto}
.daylist .tm{font-weight:800;color:var(--b);white-space:nowrap;font-size:14px}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr{position:relative;display:block}.pr input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.pr span{display:block;text-align:center;min-height:48px;padding:10px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;cursor:pointer;font-weight:400;font-size:16px}
.pr input:checked+span{border-color:var(--c);background:var(--sky)}
.pr input:focus-visible+span{outline:3px solid var(--b)}
.mlist{list-style:none;padding:0;margin:0}.mlist li{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:48px}.mlist .nm{flex:1}.mlist small{color:var(--mute)}
#modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.5);display:grid;place-items:end center}
#modal[hidden]{display:none}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));display:grid;gap:12px;text-align:center;position:relative;overflow:hidden auto;max-height:92vh}
.loading h2{color:var(--ink);margin:6px 0}.btn:disabled{opacity:.6}
.sheet .mascot{margin:0 auto}.sheet h2{font-size:28px;margin:0}.sheet p{margin:0;color:var(--mute)}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.pill{border:2px solid var(--c);border-radius:16px;overflow:hidden}.pill small{display:block;background:var(--c);color:#fff;padding:4px;font-size:14px}.pill b{display:block;font-size:28px;padding:8px;color:var(--c)}
.confetti i{position:absolute;top:-16px;width:10px;height:14px;border-radius:3px;animation:fall 2s ease-in forwards}
.empty{color:var(--mute);text-align:center;padding:24px 10px}
.hint{color:var(--mute);font-size:14px;margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;font-weight:700;width:max-content;max-width:90vw;text-align:center}
.loading{text-align:center;padding:70px 0;color:var(--mute)}.loading .mascot{margin:0 auto 10px}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar[hidden]{display:none}
.tabbar button{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:2px solid transparent;border-radius:14px;padding:5px 0;color:var(--mute);cursor:pointer;min-height:58px}
.tabbar button.on{background:var(--sky);border-color:var(--b);color:var(--b)}
.tabbar svg{width:28px;height:28px}.tabbar span{font-size:13px;font-weight:400}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes bob{50%{transform:translateY(-8px)}}.bob{animation:bob 1.3s ease-in-out infinite}
@keyframes fall{to{transform:translateY(520px) rotate(600deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:380px){.hero{grid-template-columns:88px minmax(0,1fr)}.mascot{width:88px;height:88px}.bubble{font-size:16px}.board li{grid-template-columns:26px 10px minmax(0,1fr) 48px}.board .sub{display:none}}
</style></head><body>

<div class="app">
<header class="top" id="top"></header>
<main id="view"></main>
</div>

function gath(){const m={};for(const c of Object.values(st.checkins))for(const [d,t] of Object.entries(c.dates||{}))if(!m[d])m[d]=t;return Object.keys(m).sort().map(d=>({d,t:m[d]}))}
function stats(id){
 const mine=datesOf(id);let join=(st.members[id]||{}).joined||'9999';
 for(const d in mine)if(d<join)join=d;
 const G=gath().map(g=>g.d).filter(d=>d>=join);const total=Object.keys(mine).length;
 let best=0,run=0;for(const d of G){if(mine[d]){run++;best=Math.max(best,run)}else run=0}
 let cur=0;for(let i=G.length-1;i>=0;i--){if(mine[G[i]])cur++;else if(G[i]===today())continue;else break}
 const att=G.filter(d=>mine[d]).length;
 return {total,best,cur,n:G.length,rate:G.length?Math.round(att/G.length*100):0,xp:total*10};
}

async function all(table,orders){let out=[],from=0;for(;;){let q=sb.from(table).select('*');for(const o of orders)q=q.order(o);const r=chk(await q.range(from,from+999));out=out.concat(r.data);if(r.data.length<1000)return out;from+=1000}}

 loading=(async()=>{

   const [mem,att,nots,wk,cf,ab]=await Promise.all([all('members',['id']),all('attendance',['member_id','day']),all('notices',['created_at']),
    sb.from('week_songs').select('*').eq('id',1).maybeSingle().then(chk),sb.from('app_config').select('*').eq('id',1).maybeSingle().then(chk),all('absences',['member_id','day'])]);
   if(g!==gen)return;
   const members={},pending={},checkins={},notices={},meta={},abs={};
   ab.forEach(a=>{abs[a.member_id+'|'+a.day]=a.reason});
   mem.forEach(m=>{const o={name:m.name,part:m.part,joined:m.joined,manual:m.manual,approved:m.approved!==false};(o.approved?members:pending)[m.id]=o});
   att.forEach(a=>{(checkins[a.member_id]||(checkins[a.member_id]={dates:{}})).dates[a.day]=a.kind;meta[a.member_id+'|'+a.day]={at:a.created_at,by:a.marked_by}});
   nots.forEach(n=>{notices[n.id]={title:n.title,body:n.body,pinned:n.pinned,at:n.created_at}});
   st={members,pending,checkins,notices,week:wk.data?{label:wk.data.label,items:wk.data.items||[]}:null,cfg:cf.data?{owner:cf.data.owner,managers:cf.data.managers||[]}:{},meta,abs};
   loaded=true;ui.synced=true;ui.slow=false;
   if(!cf.data&&!cfgChecked){cfgChecked=true;const r=await sb.from('app_config').insert({id:1,owner:me,managers:[]});
    if(!r.error&&g===gen){st.cfg={owner:me,managers:[]};toast('첫 가입자라서 대표 관리자가 되었어요.')}}
  }catch(e){if(g===gen){if(!loaded)ui.slow=true;toast(errMsg(e,'불러오지 못했어요. 인터넷 연결을 확인해 주세요.'))}}
 })();

}

  if(t==='members'&&st.members[id]&&!st.members[id].manual){const o={...st.members};delete o[id];st={...st,members:o};return fnSafe(()=>adminCall({action:'delete_account',member_id:id}),'삭제하지 못했어요.')}
  const o={...st[t]};delete o[id];st={...st,[t]:o};return safe(async()=>{chk(await sb.from(t).delete().eq('id',id))})}
 if(a==='approve'){const id=b.dataset.id,m=st.pending[id];if(!m)return;const pend={...st.pending};delete pend[id];st={...st,pending:pend,members:{...st.members,[id]:{...m,approved:true}}};
  return safe(async()=>{chk(await sb.from('members').update({approved:true}).eq('id',id));toast(m.name+'님을 승인했어요.')})}
 if(a==='reject'){const id=b.dataset.id;ui.confirm=null;const pend={...st.pending};delete pend[id];st={...st,pending:pend};return fnSafe(()=>adminCall({action:'delete_account',member_id:id}),'거절하지 못했어요.')}
 if(a==='pw'){ui.pw=b.dataset.id;render(true);const i=$('#pwf input');if(i)i.focus();return}
 if(a==='pwcancel'){ui.pw=null;return render(true)}
 if(a==='csv')return exportCsv();
 if(a==='delask'){ui.delAsk=true;return openSetup()}
 if(a==='delno'){ui.delAsk=false;return openSetup()}
 if(a==='delacct'){b.disabled=true;return (async()=>{try{await adminCall({action:'delete_account'});ui.delAsk=false;closeM();await sb.auth.signOut();toast('계정을 삭제했어요.')}catch(e){b.disabled=false;toast(FN_MSG[e&&e.fn]||'삭제하지 못했어요. 잠시 후 다시 시도해 주세요.')}})()}
 if(a==='sedit'){const w=st.week||{};ui.editSongs={label:w.label||'',items:(w.items&&w.items.length?w.items:[{t:'',n:'',l:''}]).map(x=>({t:x.t||'',n:x.n||'',l:x.l||''}))};return render(true)}
 if(a==='sadd'){readSongs();ui.editSongs.items.push({t:'',n:'',l:''});return render(true)}
 if(a==='scancel'){ui.editSongs=null;return render(true)}
 if(a==='mark')return mark(b.dataset.id);
 if(a==='share')return shareStats();
 if(a==='nshare'){const n=st.notices[b.dataset.id];if(n)shareText(noticeText(n),'공지 공유');return}
 if(a==='sshare')return shareText(songsText(),'찬양곡 공유');
 if(a==='redit'){ui.reasonEdit=b.dataset.id;render(true);const i=$('#rf input');if(i)i.focus();return}
 if(a==='rcancel'){ui.reasonEdit=null;return render(true)}
 if(a==='mgr'){const id=b.dataset.id,m=new Set(st.cfg.managers||[]);m.has(id)?m.delete(id):m.add(id);st={...st,cfg:{...st.cfg,managers:[...m]}};
  return safe(async()=>{chk(await sb.from('app_config').update({managers:[...m]}).eq('id',1))})}
});
document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target,fd=new FormData(f);
 if(f.id==='af'){const em=String(fd.get('e')||'').trim(),pw=String(fd.get('p')||''),btn=f.querySelector('.btn');btn.disabled=true;
  try{if(ui.authMode==='signup'){const r=await sb.auth.signUp({email:em,password:pw});if(r.error)throw r.error;
    if(!r.data.session)toast('가입은 됐지만 이메일 확인이 켜져 있어요. 총무님께 설명서 2단계를 부탁해 주세요.')}
   else{const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error}}
  catch(err){toast(AUTH_MSG[err&&err.code]||(/fetch|network/i.test(String(err&&err.message))?'인터넷 연결을 확인해 주세요.':'로그인하지 못했어요. 다시 시도해 주세요.'))}
  btn.disabled=false;return}
 if(f.id==='pf'){const name=String(fd.get('n')||'').trim(),part=fd.get('p');if(!name||!part)return;const p=myProfile()||{},row={name,part,joined:p.joined||today()};
  closeM();const into=st.members[me]||isAdmin()?'members':'pending';st={...st,[into]:{...st[into],[me]:{...p,...row,approved:into==='members'}}};
  return safe(async()=>{chk(await sb.from('members').upsert(isAdmin()&&!st.pending[me]?{id:me,...row,approved:true}:{id:me,...row}))})}
 if(f.id==='nf'){const title=String(fd.get('t')||'').trim();if(!title)return;const body=String(fd.get('b')||'').trim(),pinned=!!fd.get('p');
  ui.notice=false;return safe(async()=>{chk(await sb.from('notices').insert({title,body,pinned}));toast('공지를 올렸어요.')})}
 if(f.id==='sf'){readSongs();const s=ui.editSongs,items=s.items.map(x=>({t:x.t.trim(),n:x.n.trim(),l:x.l.trim()})).filter(x=>x.t),label=s.label.trim();
  ui.editSongs=null;st={...st,week:{label,items}};
  return safe(async()=>{chk(await sb.from('week_songs').upsert({id:1,label,items,updated_at:new Date().toISOString()}));toast('찬양곡을 저장했어요.')})}
 if(f.id==='rf'){const id=f.dataset.id,d=ui.listDate,reason=String(fd.get('r')||'').trim().slice(0,100),k=id+'|'+d,abs={...st.abs};if(reason)abs[k]=reason;else delete abs[k];st={...st,abs};ui.reasonEdit=null;
  return safe(async()=>{chk(reason?await sb.from('absences').upsert({member_id:id,day:d,reason,updated_at:new Date().toISOString()}):await sb.from('absences').delete().eq('member_id',id).eq('day',d))})}
 if(f.id==='pwf'){const id=f.dataset.id,np=String(fd.get('np')||''),m=st.members[id]||{};if(np.length<6)return toast('비밀번호는 6자 이상이어야 해요.');ui.pw=null;
  return fnSafe(async()=>{await adminCall({action:'reset_password',member_id:id,password:np});$('#modal').innerHTML=`<div class="sheet"><h2>비밀번호를 바꿨어요</h2><p>${esc(m.name||'대원')}님의 새 비밀번호예요. 대원에게 직접 알려 주세요.</p><p class="newpw">${esc(np)}</p><button class="btn" data-act="close">확인</button></div>`;$('#modal').hidden=false},'비밀번호를 바꾸지 못했어요.')}
 if(f.id==='mf'){const name=String(fd.get('n')||'').trim(),part=fd.get('p');if(!name||!part)return;f.reset();
  return safe(async()=>{chk(await sb.from('members').insert({id:uid('m'),name,part,joined:ui.aDate||today(),manual:true,approved:true}));toast(name+'님을 추가했어요.')})}
});
document.addEventListener('change',e=>{
 if(e.target.id==='ad'){ui.aDate=e.target.value;render(true)}
 if(e.target.id==='at')ui.aType=e.target.value;
 if(e.target.id==='ld'){ui.listDate=e.target.value;render(true)}
});
addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(VIEWS.includes(t)&&t!==tab){tab=t;render(true)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)load()});

if(sb)sb.auth.onAuthStateChange((ev,session)=>{
 const u=session&&session.user,id=u?u.id:null;
 if(authKnown&&id===me&&ev!=='SIGNED_OUT')return;
 setTimeout(()=>{
  gen++;stopLive();st=blank();loaded=false;setupDone=false;cfgChecked=false;ui.synced=false;ui.slow=false;closeM();
  authKnown=true;authed=!!u;me=id;email=u?(u.email||''):'';
  if(u){startLive();load();const g=gen;setTimeout(()=>{if(g===gen&&!loaded){ui.slow=true;render()}},10000)}
  render(true);
 },0);
});
render(true);
</script>
</body></html>
